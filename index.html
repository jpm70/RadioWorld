<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Radio Tuner</title>
    <style>
        :root {
            --radio-body: #333;
            --panel-metal: #444;
            --display-bg: #1a1a1a;
            --display-text: #00ff41; /* Verde digital retro */
            --accent-gold: #d4af37;
        }

        body {
            background-color: #1a1a1a;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Courier New', Courier, monospace;
        }

        /* El chasis de la radio */
        .radio-case {
            background: var(--radio-body);
            width: 90%;
            max-width: 500px;
            padding: 30px;
            border-radius: 40px;
            border: 8px solid #222;
            box-shadow: 0 20px 50px rgba(0,0,0,0.8), inset 0 2px 5px rgba(255,255,255,0.1);
            position: relative;
        }

        /* Rejilla del altavoz */
        .speaker-grill {
            width: 80px;
            height: 80px;
            background-image: radial-gradient(#111 20%, transparent 20%);
            background-size: 5px 5px;
            border-radius: 50%;
            position: absolute;
            top: 30px;
            right: 40px;
            border: 3px solid #222;
        }

        h1 {
            color: var(--accent-gold);
            font-size: 1.2rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-top: 0;
            margin-bottom: 25px;
            text-shadow: 1px 1px 2px black;
        }

        /* Pantalla Digital */
        .digital-display {
            background: var(--display-bg);
            padding: 15px;
            border-radius: 8px;
            border: 4px solid #555;
            margin-bottom: 25px;
            min-height: 80px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            box-shadow: inset 0 0 15px rgba(0,0,0,1);
        }

        #status-text {
            color: var(--display-text);
            font-size: 0.75rem;
            margin-bottom: 5px;
            opacity: 0.8;
        }

        #current-station {
            color: var(--display-text);
            font-size: 1.1rem;
            font-weight: bold;
            text-shadow: 0 0 8px var(--display-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Controles */
        .controls {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 15px;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }

        .control-group {
            margin-bottom: 15px;
        }

        label {
            color: #aaa;
            font-size: 0.7rem;
            display: block;
            margin-bottom: 5px;
            text-transform: uppercase;
        }

        select {
            width: 100%;
            background: #444;
            color: white;
            border: 1px solid #666;
            padding: 8px;
            border-radius: 4px;
            cursor: pointer;
            outline: none;
        }

        select:focus { border-color: var(--accent-gold); }

        /* Reproductor de Audio (Personalizado mínimamente) */
        audio {
            width: 100%;
            height: 35px;
            margin-top: 20px;
            filter: invert(80%) hue-rotate(180deg) brightness(1.2);
        }

        .brand {
            text-align: right;
            color: #555;
            font-size: 0.6rem;
            margin-top: 15px;
            font-style: italic;
        }

        /* Animación para el texto de la emisora */
        .marquee {
            overflow: hidden;
            position: relative;
        }
    </style>
</head>
<body>

<div class="radio-case">
    <div class="speaker-grill"></div>
    <h1>Retro Tuner v1.0</h1>

    <div class="digital-display">
        <div id="status-text">Buscando señal...</div>
        <div class="marquee">
            <div id="current-station">SINTONICE UNA EMISORA</div>
        </div>
    </div>

    <div class="controls">
        <div class="control-group">
            <label>País / Región</label>
            <select id="countrySelect">
                <option value="">Cargando servidores...</option>
            </select>
        </div>

        <div class="control-group">
            <label>Dial de Emisoras</label>
            <select id="stationSelect" disabled>
                <option value="">Seleccione país</option>
            </select>
        </div>

        <audio id="audioPlayer" controls>
            Tu navegador no soporta audio.
        </audio>
    </div>

    <div class="brand">Model: www.unfantasmaenelsistema.com - High-Fidelity-2026</div>
</div>

<script>
    let apiServer = "";

    async function initRadio() {
        try {
            const response = await fetch('https://all.api.radio-browser.info/json/servers');
            const servers = await response.json();
            const randomServer = servers[Math.floor(Math.random() * servers.length)];
            apiServer = `https://${randomServer.name}`;
            document.getElementById('status-text').innerText = `SYSTEM READY: ${randomServer.name.toUpperCase()}`;
            loadCountries();
        } catch (error) {
            document.getElementById('status-text').innerText = "CONNECTION ERROR";
        }
    }

    async function loadCountries() {
        try {
            const response = await fetch(`${apiServer}/json/countries?order=name`);
            const countries = await response.json();
            const select = document.getElementById('countrySelect');
            select.innerHTML = '<option value="">-- ELIGE PAÍS --</option>';
            countries.forEach(c => {
                if(c.name.trim() !== "") {
                    const opt = document.createElement('option');
                    opt.value = c.iso_3166_1;
                    opt.textContent = c.name.toUpperCase();
                    select.appendChild(opt);
                }
            });
        } catch (e) { console.error(e); }
    }

    async function loadStations(code) {
        const sSelect = document.getElementById('stationSelect');
        sSelect.disabled = false;
        sSelect.innerHTML = '<option>SINTONIZANDO...</option>';
        document.getElementById('status-text').innerText = "BUSCANDO EMISORAS...";

        try {
            const res = await fetch(`${apiServer}/json/stations/bycountrycodeexact/${code}?order=clickcount&reverse=true&limit=100`);
            const stations = await res.json();
            sSelect.innerHTML = '<option value="">-- SELECCIONAR DIAL --</option>';
            stations.forEach(s => {
                const opt = document.createElement('option');
                opt.value = s.url_resolved;
                opt.dataset.name = s.name;
                opt.dataset.uuid = s.stationuuid;
                opt.textContent = s.name.substring(0, 30).toUpperCase();
                sSelect.appendChild(opt);
            });
            document.getElementById('status-text').innerText = "SEÑAL ENCONTRADA";
        } catch (e) { document.getElementById('status-text').innerText = "ERROR DE BÚSQUEDA"; }
    }

    function playStation(url, name, uuid) {
        const player = document.getElementById('audioPlayer');
        const display = document.getElementById('current-station');
        display.innerText = name.toUpperCase();
        player.src = url;
        player.play();
        document.getElementById('status-text').innerText = "REPRODUCIENDO AHORA:";
        fetch(`${apiServer}/json/url/${uuid}`);
    }

    document.getElementById('countrySelect').addEventListener('change', e => loadStations(e.target.value));
    document.getElementById('stationSelect').addEventListener('change', e => {
        const opt = e.target.options[e.target.selectedIndex];
        if (opt.value) playStation(opt.value, opt.dataset.name, opt.dataset.uuid);
    });

    initRadio();
</script>
</body>

</html>
